name: ci

on:
  push:
  pull_request:

env:
  VCPKG_COMMIT: e456309491fd875487bf02b8a0dca76c1b1b00cc
  QT_VERSION: 6.11.3

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: debug
          - os: ubuntu-24.04
            preset: asan
          - os: macos-14
            preset: debug
    runs-on: ${{ matrix.os }}
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
      # LeakSanitizer acusa vazamentos de libs do sistema (fontconfig, drivers GL); mantém só ASan.
      ASAN_OPTIONS: detect_leaks=0
    steps:
      - uses: actions/checkout@v4

      - name: Dependências do sistema (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build nasm libgl1-mesa-dev libxkbcommon-dev

      - name: Dependências do sistema (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja nasm

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
          # aqtinstall do PyPI (3.3.0) não suporta o layout de repo do Qt 6.11+; mesmo pin do install-qt.cmd.
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-${{ matrix.os }}-${{ hashFiles('vcpkg.json') }}

      - name: vcpkg
        shell: bash
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout "$VCPKG_COMMIT"
          if [ "$RUNNER_OS" = "Windows" ]; then "$VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics; else "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics; fi

      - name: Configurar
        run: cmake --preset ${{ matrix.preset }}

      - name: Compilar
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Testar
        run: ctest --preset ${{ matrix.preset }}

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Mesma versão do clang-format do VS 2026 local, para os dois formatarem igual.
      # pipx: o Python do sistema no Ubuntu 24.04 recusa pip install global (PEP 668).
      - run: pipx run --spec clang-format==22.1.3 clang-format --dry-run --Werror $(git ls-files '*.cpp' '*.h')
